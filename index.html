<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 6 | 문장 클릭 의미 단위 해석 (한·중·러)</title>
<style>
:root{--ink:#1b3242;--muted:#627481;--green:#13785f;--mint:#e9f8f1;--edge:#dce8e5;--bg:#f5f9f7;--scale:1}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic","Noto Sans CJK KR",sans-serif;background:var(--bg);color:var(--ink);font-size:calc(16px * var(--scale))}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffbd54;outline-offset:2px}header{padding:26px max(18px,calc((100vw - 1020px)/2));background:linear-gradient(125deg,#d8f6e8,#ebf6ff);border-bottom:1px solid #c9e4db}h1{font-size:clamp(1.45rem,4vw,2.2rem);line-height:1.22;margin:0 0 10px}header p{margin:0;color:#425e68;line-height:1.65}.mark{font-size:.78rem;color:#096c53;background:#fff;border:1px solid #a8d9c8;border-radius:99px;padding:5px 10px;display:inline-block;margin-bottom:12px;font-weight:700}main{max-width:1050px;margin:auto;padding:18px 18px 65px}.toolrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}.toolrow .left,.toolrow .right{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.toolrow button,.langbtn{border:1px solid #bdd9cd;background:white;color:#315c51;border-radius:10px;padding:9px 12px;font-size:.9rem;font-weight:700}.langbtn.active{background:#146e59;color:white;border-color:#146e59}.label{color:#50686b;font-size:.86rem;font-weight:700}.tabs{position:sticky;top:0;z-index:10;background:var(--bg);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 0;border-bottom:1px solid var(--edge)}.tab{background:#fff;border:1px solid var(--edge);padding:13px 6px;border-radius:14px;font-weight:800;color:#5d716e;line-height:1.5}.tab.active{background:#147b60;color:white;border-color:#147b60;box-shadow:0 4px 10px #147b6020}.tab small{font-weight:500;font-size:.74rem;display:block}.sectionHeading{margin:23px 0 7px;display:flex;align-items:center;gap:10px}.sectionHeading h2{margin:0;font-size:1.5rem}.pill{font-weight:700;font-size:.77rem;color:#14765b;background:#dff5e9;border-radius:20px;padding:5px 11px}.subtitle{color:#5a7077;margin:0 0 18px}.instructions{border-left:4px solid #65b99d;background:#e9f8f0;padding:12px 15px;border-radius:9px;color:#3d5b53;margin-bottom:18px;line-height:1.5}.sentences{display:grid;gap:13px}.sentenceBox{background:white;border:1px solid var(--edge);border-radius:17px;box-shadow:0 2px 6px #1a5c4010;overflow:hidden}.sentenceTop{width:100%;background:transparent;display:flex;align-items:flex-start;gap:12px;text-align:left;border:0;padding:17px 19px;color:var(--ink)}.number{display:inline-grid;place-items:center;flex-shrink:0;background:#def2e7;color:#13684e;font-weight:800;width:32px;height:32px;border-radius:10px}.english{font-size:1.08rem;font-weight:650;line-height:1.6;flex:1}.chev{color:#438874;align-self:center;font-size:1.2rem}.sentenceBox.open .sentenceTop{background:#f2faf6}.detail{padding:2px 17px 19px;border-top:1px dashed #c7e2d6}.chunkIntro{font-size:.86rem;color:#647a78;margin:15px 3px 12px}.chunkWrap{display:grid;gap:10px}.chunk{border:1px solid #d9e8e3;border-radius:13px;padding:12px 14px;background:#fcfffe}.chunkEnglish{display:inline-block;color:#067256;font-weight:800;border-radius:8px;background:#e8f8ee;padding:5px 8px;margin:0 0 9px;line-height:1.45}.translation{display:grid;grid-template-columns:43px 1fr;gap:6px;line-height:1.55;margin:5px 0;align-items:start}.translation .flag{font-size:.75rem;background:#eef3f6;border-radius:5px;text-align:center;color:#55717b;font-weight:800;padding:3px 0;margin-top:2px}.translation .meaning{overflow-wrap:anywhere}.hide{display:none!important}.note{font-size:.77rem;color:#71837e;margin-top:28px;text-align:center}.empty{padding:30px;text-align:center} @media(max-width:620px){header{padding:22px 18px}.tab{font-size:.88rem;padding:11px 2px}.tab small{font-size:.68rem}.sentenceTop{padding:14px 12px}.english{font-size:1rem}.detail{padding:2px 11px 14px}.number{width:29px;height:29px}.toolrow{align-items:flex-start}.toolrow .right{margin-left:auto}.translation{grid-template-columns:37px 1fr}}
@media print{.tabs,.toolrow,.instructions,.chev{display:none!important}.sentenceBox{break-inside:avoid}.detail{display:block!important}header{background:none}body{background:white}.sectionHeading{margin-top:12px}}
</style>
</head><body>
<header><span class="mark">UNIT 6 · ZERO-WASTE CHALLENGE</span><h1>문장을 누르면 뜻이 보여요! 🌱</h1><p>올리비아·도밍고·엠마·민수의 영어 본문을 읽고, 문장을 클릭하세요.<br>영어를 <b>의미 단위</b>로 나누어 한국어·중국어·러시아어 뜻을 확인할 수 있습니다.</p></header>
<main>
<div class="toolrow"><div class="left"><span class="label">해석 언어</span><button type="button" class="langbtn active" data-lang="all">한·중·러 모두</button><button type="button" class="langbtn" data-lang="ko">한국어</button><button type="button" class="langbtn" data-lang="zh">中文</button><button type="button" class="langbtn" data-lang="ru">Русский</button></div><div class="right"><button id="allBtn" type="button">모두 펼치기</button><button id="noneBtn" type="button">모두 접기</button><button id="smallBtn" type="button" aria-label="글씨 작게">A−</button><button id="largeBtn" type="button" aria-label="글씨 크게">A＋</button></div></div>
<nav class="tabs" aria-label="본문 인물 선택"><button type="button" class="tab active" data-section="olivia">Olivia<small>음식물 줄이기</small></button><button type="button" class="tab" data-section="domingo">Domingo<small>다시 사용하기</small></button><button type="button" class="tab" data-section="emma">Emma<small>일회용품 줄이기</small></button><button type="button" class="tab" data-section="minsu">Minsu<small>재활용하기</small></button></nav>
<div id="view"></div>
<p class="note">📖 교과서 Unit 6 · p.98–100 | 인터넷 연결 없이 작동합니다. 문장 뜻은 의미 단위별 학습용 해석입니다.</p>
</main>
<script>
// 각 문장의 조각: [영어, 한국어, 중국어(간체), 러시아어]
const book={
 olivia:{name:'Olivia',title:'Challenge 01 · Reduce Food Waste',page:'p.98',sentences:[
 [['My birthday','내 생일은','我的生日','Мой день рождения'],['was last Saturday,','지난 토요일이었고,','是上周六，','был в прошлую субботу,'],['and my family and I','그리고 우리 가족과 나는','我和家人','и мы с семьёй'],['ate out.','외식했다.','在外面吃了饭。','поели вне дома.']],
 [['There were lots of leftovers,','남은 음식이 많이 있었지만,','剩下了很多食物，','Осталось много еды,'],['but we brought them home.','우리는 그것들을 집으로 가져왔다.','但我们把它们带回家了。','но мы забрали её домой.']],
 [['The next day,','다음 날,','第二天，','На следующий день,'],['I made a nice lunch','나는 맛있는 점심을 만들었다','我做了一顿美味的午餐','я приготовила вкусный обед'],['out of them.','그 남은 음식으로.','用那些剩下的食物。','из этих остатков еды.']],
 [['FYI,','참고로,','顺便告诉你，','К сведению,'],['you can find great cooking ideas','너는 좋은 요리 아이디어를 찾을 수 있다','你可以找到很棒的烹饪点子','можно найти отличные идеи для готовки'],['for leftovers','남은 음식을 활용하는','关于剩菜的','из остатков еды'],['on the Internet.','인터넷에서.','在网上。','в интернете.']]
 ]},
 domingo:{name:'Domingo',title:'Challenge 02 · Reuse',page:'p.99',sentences:[
 [['My dog','내 개가','我的狗','Моя собака'],['tore my bag.','내 가방을 찢었다.','咬破了我的包。','порвала мою сумку.']],
 [['I wanted to buy a new one,','나는 새 가방을 사고 싶었지만,','我本来想买一个新包，','Я хотел купить новую сумку,'],['but I thought again.','다시 생각해 보았다.','但我又想了想。','но передумал.']],
 [['I learned that','나는 ~라는 것을 배웠다','我了解到','Я узнал, что'],['reusing is important','재사용하는 것이 중요하다는 것','重复使用很重要','повторное использование важно'],['for zero-waste living.','쓰레기 없는 생활을 위해.','对于零废弃生活。','для жизни без отходов.']],
 [['So,','그래서,','所以，','Поэтому'],['I decided to fix it','나는 그것을 고치기로 결심했다','我决定把它修好','я решил починить её'],['and reuse it.','그리고 다시 사용하기로 했다.','并继续使用它。','и снова использовать.']],
 [["I'm not very good at sewing,",'나는 바느질을 아주 잘하지는 못하고,','我不太擅长缝纫，','Я не очень хорошо умею шить,'],["and I don't think that",'그리고 나는 ~라고 생각하지 않는다','而且我不认为','и я не думаю, что'],['the bag looks perfect.','가방이 완벽해 보인다고.','这个包看起来很完美。','сумка выглядит идеально.']],
 [["I guess",'내 생각에는','我想','Думаю,'],["it's all right.",'괜찮은 것 같다.','这样也没关系。','это вполне нормально.']]
 ]},
 emma:{name:'Emma',title:'Challenge 03 · Say No to Single-Use Plastic',page:'p.99',sentences:[
 [['I often use','나는 자주 이용한다','我经常使用','Я часто пользуюсь'],['food delivery services,','음식 배달 서비스를,','外卖配送服务，','доставкой еды,'],["but today I didn't.",'하지만 오늘은 이용하지 않았다.','但今天没有。','но сегодня не стала.']],
 [['Instead,','대신에,','而是，','Вместо этого'],['I walked to my favorite restaurant','나는 가장 좋아하는 식당까지 걸어갔다','我步行去了最喜欢的餐厅','я пешком пошла в свой любимый ресторан'],['with a reusable container','재사용 가능한 용기를 가지고','带着一个可重复使用的容器','с многоразовым контейнером'],['and picked up the food.','그리고 음식을 직접 가져왔다.','并把食物取了回来。','и забрала еду.']],
 [['I heard that','나는 ~라고 들었다','我听说','Я слышала, что'],['plastic never goes away','플라스틱은 결코 사라지지 않는다고','塑料永远不会消失','пластик никогда не исчезает'],['completely.','완전히.','得无影无踪。','полностью.']],
 [["I didn't use",'나는 사용하지 않았다','我没有使用','Я не использовала'],['any single-use plastic','어떠한 일회용 플라스틱도','任何一次性塑料制品','никакого одноразового пластика'],['today.','오늘.','今天。','сегодня.']],
 [['I felt good!','기분이 좋았다!','我感觉很开心！','Я была довольна!']]
 ]},
 minsu:{name:'Minsu',title:'Challenge 04 · Recycle',page:'p.100',sentences:[
 [['Yesterday,','어제,','昨天，','Вчера'],['I took some plastic and glass bottles','나는 플라스틱병과 유리병 몇 개를 가져갔다','我带了一些塑料瓶和玻璃瓶','я отнёс несколько пластиковых и стеклянных бутылок'],['to a recycling machine','재활용 기계로','到一台回收机器那里','к автомату для переработки'],['near my house.','우리 집 근처에 있는.','在我家附近。','рядом с моим домом.']],
 [['I put them into the machine','나는 그것들을 기계 안에 넣었고','我把它们放进机器里','Я положил их в автомат'],['one by one,','하나씩,','一个接一个，','по одной,'],['and I got some points','그리고 포인트를 받았다','并得到了一些积分','и получил баллы'],['in return.','그 대가로.','作为回报。','взамен.']],
 [['What can I do','나는 무엇을 할 수 있을까','我能做什么','Что я могу сделать'],['with those points?','그 포인트로?','用那些积分呢？','с этими баллами?']],
 [['Well,','음,','嗯，','Ну,'],['I can use them','나는 그것들을 사용할 수 있다','我可以使用它们','я могу использовать их'],['like money.','돈처럼.','像钱一样。','как деньги.']],
 [["Don't you think",'너도 ~라고 생각하지 않니?','你不觉得','Разве ты не думаешь,'],["that's cool?",'그게 멋지다고?','这很酷吗？','что это здорово?']]
 ]}
};
let current='olivia',lang='all',allOpen=false,size=1;
const view=document.getElementById('view');
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(){const b=book[current];view.innerHTML=`<div class="sectionHeading"><h2>${b.name}</h2><span class="pill">${b.page}</span></div><p class="subtitle">${b.title} · ${b.sentences.length}문장</p><div class="instructions">👆 영어 문장을 누르면 <b>의미 단위별 해석</b>이 펼쳐집니다. 문장을 다시 누르면 접힙니다.</div><div class="sentences">${b.sentences.map((s,i)=>`<article class="sentenceBox ${allOpen?'open':''}"><button type="button" class="sentenceTop" aria-expanded="${allOpen}" aria-controls="detail-${i}"><span class="number">${i+1}</span><span class="english">${escapeHtml(s.map(c=>c[0]).join(' '))}</span><span class="chev">${allOpen?'▴':'▾'}</span></button><div class="detail ${allOpen?'':'hide'}" id="detail-${i}"><p class="chunkIntro">영어를 / 의미 단위로 끊어 읽어 보세요.</p><div class="chunkWrap">${s.map(c=>`<div class="chunk"><div class="chunkEnglish">${escapeHtml(c[0])}</div>${[['ko','한',c[1]],['zh','中',c[2]],['ru','РУ',c[3]]].map(([code,flag,t])=>`<div class="translation ${lang!=='all'&&lang!==code?'hide':''}" data-code="${code}"><span class="flag">${flag}</span><span class="meaning">${escapeHtml(t)}</span></div>`).join('')}</div>`).join('')}</div></div></article>`).join('')}</div>`;
view.querySelectorAll('.sentenceTop').forEach(btn=>btn.addEventListener('click',()=>{const card=btn.closest('.sentenceBox'),detail=card.querySelector('.detail'),open=card.classList.toggle('open');detail.classList.toggle('hide',!open);btn.setAttribute('aria-expanded',open);btn.querySelector('.chev').textContent=open?'▴':'▾';}));}
document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{current=btn.dataset.section;allOpen=false;document.querySelectorAll('.tab').forEach(x=>{x.classList.toggle('active',x===btn);x.setAttribute('aria-selected',String(x===btn))});render()});
document.querySelectorAll('.langbtn').forEach(btn=>btn.onclick=()=>{lang=btn.dataset.lang;document.querySelectorAll('.langbtn').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.translation').forEach(x=>x.classList.toggle('hide',lang!=='all'&&x.dataset.code!==lang));});
document.getElementById('allBtn').onclick=()=>{allOpen=true;render()};document.getElementById('noneBtn').onclick=()=>{allOpen=false;render()};
document.getElementById('largeBtn').onclick=()=>{size=Math.min(1.4,Math.round((size+.1)*10)/10);document.documentElement.style.setProperty('--scale',size)};
document.getElementById('smallBtn').onclick=()=>{size=Math.max(.8,Math.round((size-.1)*10)/10);document.documentElement.style.setProperty('--scale',size)};
render();
</script></body></html>
